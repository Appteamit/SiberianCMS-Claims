<ion-view sb-page-background
          class="claims claims-home"
          ng-controller="ClaimsController">
    <ion-nav-title> {{ page_title }}</ion-nav-title>

    <ion-nav-buttons side="secondary">
        <button class="button button-clear header-item"
                ui-sref="claims-add({value_id: value_id})"
                ng-if="is_logged_in && !is_loading">
            <i class="icon ion-plus-round"></i>
        </button>
    </ion-nav-buttons>

    <ion-content class="has-header">

        <div class="list"
             ng-if="!is_logged_in && !is_loading">
            <div class="item item-body item-custom claims-login-button remove-border">
                <button class="button button-block button-positive button-positive-custom"
                        ng-click="login()">
                    {{ ::"Click here to log-in" | translate:"claims" }}
                </button>
            </div>
        </div>

        <div class="list card"
             ng-if="is_logged_in && !is_loading && !claimsList.length">
            <div class="item item-custom remove-border item-body">
                <p class="text-center">{{ ::"You have not submitted any claim yet!" | translate:"claims" }}</p>
            </div>
        </div>

        <div class="list card"
             ng-if="is_logged_in && !is_loading"
             ng-repeat="value in claimsList">
            <div class="item item-custom remove-border claim-info-first"
                 ui-sref="claims-view({value_id: value_id,id:value.id })">
                <h2>{{value.title}}</h2>
                <p class="opacity6" ng-if="value.location!=''">{{value.location}}</p>
                <p class="opacity6">{{value.start_date}}<span ng-if="value.end_date!=''"> - {{value.end_date}}</span>
                </p>
            </div>

            <div class="item item-custom remove-border claim-info-second">
                <h2 class="icon-active-custom text-right"><span>{{value.currency_code}}</span>{{value.amount}}</h2>
                <p class="text-right opacity6">{{value.status_name}}</p>
            </div>
        </div>

        <div class="loader"
             ng-show="is_loading">
            <ion-spinner class="spinner-custom"></ion-spinner>
        </div>


    </ion-content>


</ion-view>
