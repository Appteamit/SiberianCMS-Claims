<ion-view sb-page-background
          class="claims claims-home"
          ng-controller="ClaimsAddController">
    <ion-nav-title>{{ ::"New Claim" | translate:"claims" }}</ion-nav-title>

    <ion-content class="has-header">

        <div class="list">

            <label class="item item-custom item-input item-stacked-label">
                <span class="input-label">{{ ::"Title" | translate:"claims" }} *</span>
                <input type="text"
                       ng-model="claim_post.title"
                       ng-init="claim_post.title == ''"
                       ng-value="">
            </label>

            <label class="item item-custom item-input item-stacked-label">
                <span class="input-label">{{ ::"Location" | translate:"claims" }} *</span>
                <input type="text"
                       ng-model="claim_post.location"
                       ng-init="claim_post.location == ''"
                       ng-value="">
            </label>

            <label class="item item-custom item-input item-stacked-label">
                <span class="input-label">{{ ::"Start Date" | translate:"claims" }} *</span>
                <input type="date"
                       ng-model="claim_post.start_date"
                       ng-init="claim_post.start_date == ''"
                       ng-value="">
            </label>

            <label class="item item-custom item-input item-stacked-label">
                <span class="input-label">{{ ::"End Date" | translate:"claims" }} </span>
                <input type="date"
                       ng-model="claim_post.end_date">
            </label>


            <div class="item item-custom remove-border">
                <button ng-click="claimSave()"
                        ng-disabled="((claim_post.title == '' && claim_post.location == '' && claim_post.start_date == '' ) ? true : false)"
                        class="button button-full button-positive-custom">
                    {{ ::"Next" | translate:"claims" }}
                </button>
            </div>

        </div>

    </ion-content>
</ion-view>
